name: Update README feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          readme_path: ./README.draft.md
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCJm7i4g4z7ZGcJA_HKHLCVw"
          max_post_count: 4
          template: '<tr><td width="220"><a href="$url"><img src="$image" width="200" alt="$title"/></a></td><td valign="middle"><a href="$url"><b>$title</b></a><br/><sub>$publishDate</sub></td></tr>'

      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          readme_path: ./README.draft.md
          comment_tag_name: BLOG-POST-LIST
          feed_list: "https://dev.to/feed/abuanwar072,https://medium.com/feed/@theflutterway"
          max_post_count: 4
          template: '<tr><td width="220"><a href="$url"><img src="$image" width="200" alt="$title"/></a></td><td valign="middle"><a href="$url"><b>$title</b></a><br/><sub>$publishDate</sub></td></tr>'
